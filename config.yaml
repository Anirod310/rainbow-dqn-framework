environment:
  name: ALE/Breakout-v5
  frameskip_env: 1
  frameskip_wrap: 4

preprocessing:
  enabled: true
  type: atari
  frame_stack_size: 4
  image_size: [84, 84]

agent:
  epsilon_start: 1.0
  epsilon_end: 0.1
  annealing_duration: 1000000

replay_buffer:
  memory_capacity: 100000 #For the moment only 100k since 1M would use 53GiB (100k uses 4GiB)
  mini_batch_size: 32

learning:
  gamma: 0.99
  learning_rate: 0.00025
  gradient_momentum: 0.95
  squared_gradient_momentum: 0.95
  min_squared_gradient: 0.01
  target_network_update_freq: 10000

training:
  num_episodes: 5000

evaluate:
  num_episodes: 10
  weights_path: checkpoints/baseline/latest.pth