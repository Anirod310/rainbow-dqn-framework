environment:
  type: atari
  name: ALE/SpaceInvaders-v5
  frameskip_env: 1
  frameskip_wrap: 4
  render_mode: null

  wrappers:
    fire_reset:
      enabled: false

  random_seed: 41
  device: cuda

preprocessing:
  enabled: true
  type: atari
  frame_stack_size: 4
  image_size: [84, 84]

model:
  dueling_network:
    enabled: false

agent:
  epsilon_start: 1.0
  epsilon_end: 0.1
  annealing_duration: 1000000

replay_buffer:
  memory_capacity: 300000
  mini_batch_size: 32

learning:
  DDQN:
    enabled: false

  optimizer:
    name: RMSprop

    RMSprop:
      lr: 0.00025
      momentum: 0 #Not the momentum of the paper, which is applied with alpha and centered parameters
      alpha: 0.95 #squared gradient momentum
      eps: 0.003 #min squared gradient
      centered: true

    Adam:
      lr: 0.0005 
      eps: 0.00015

  gamma: 0.99
  target_network_update_freq: 10000
  update_frequency: 4 #Learning occurs each update_frequency agent actions

training:
  num_episodes: 30000
  total_frames: 50000000
  replay_learning_start: 50000
  print_interval_frames: 1000000
  reward_window_size: 100

evaluate:
  num_render_episodes: 10 
  num_episodes: 100
  checkpoint_path: checkpoints/space_invaders/dqn_seed41_buffer300k_50M_frames_momentum_zero.pth

