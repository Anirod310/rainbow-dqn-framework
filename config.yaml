environment:
  type: vector
  name: LunarLander-v3
  frameskip_env: 1
  frameskip_wrap: 4
  render_mode: null

  wrappers:
    fire_reset:
      enabled: false

  random_seed: 43
  device: cpu

preprocessing:
  enabled: false
  type: atari
  frame_stack_size: 4
  image_size: [84, 84]

agent:
  epsilon_start: 1.0
  epsilon_end: 0.1
  annealing_duration: 50000

replay_buffer:
  memory_capacity: 1000000
  mini_batch_size: 128

learning:
  optimizer:
    name: Adam

    RMSprop:
      lr: 0.00025
      momentum: 0.95 #gradient momentum
      alpha: 0.95 #squared gradient momentum
      eps: 0.01 #min squared gradient
      centered: true

    Adam:
      lr: 0.0005 
      eps: 0.00015

  gamma: 0.99
  target_network_update_freq: 1000
  update_frequency: 1 #Learning occurs each update_frequency agent actions

training:
  num_episodes: 5000
  total_frames: 500000
  replay_learning_start: 1000

evaluate:
  num_render_episodes: 10 
  num_episodes: 100
  checkpoint_path: checkpoints/lunar_lander/dqn_seed43_Adam_500k_frames_cpu.pth