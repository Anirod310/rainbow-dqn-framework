environment:
  type: atari
  name: ALE/Breakout-v5
  frameskip_env: 1
  frameskip_wrap: 4
  render_mode: null

  wrappers:
    fire_reset:
      enabled: true

  random_seed: 42

preprocessing:
  enabled: true
  type: atari
  frame_stack_size: 4
  image_size: [84, 84]

agent:
  epsilon_start: 1.0
  epsilon_end: 0.1
  annealing_duration: 1000000

replay_buffer:
  memory_capacity: 300000
  mini_batch_size: 32

learning:
  gamma: 0.99
  learning_rate: 0.00025
  gradient_momentum: 0.95
  squared_gradient_momentum: 0.95
  min_squared_gradient: 0.01
  target_network_update_freq: 10000

training:
  num_episodes: 30000

evaluate:
  num_episodes: 30
  checkpoint_path: checkpoints/baseline/latest_seed42_buffer300k_30kEps.pth