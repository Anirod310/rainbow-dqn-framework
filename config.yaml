environment:
  type: atari
  name: ALE/SpaceInvaders-v5
  frameskip_env: 1
  frameskip_wrap: 4
  render_mode: null

  wrappers:
    fire_reset:
      enabled: false

  random_seed: 42

preprocessing:
  enabled: true
  type: atari
  frame_stack_size: 4
  image_size: [84, 84]

agent:
  epsilon_start: 1.0
  epsilon_end: 0.1
  annealing_duration: 1000000

replay_buffer:
  memory_capacity: 300000
  mini_batch_size: 32

learning:
  gamma: 0.99
  learning_rate: 0.00025
  gradient_momentum: 0.95
  squared_gradient_momentum: 0.95
  min_squared_gradient: 0.01
  target_network_update_freq: 10000
  update_frequency: 4 #Learning occurs each 4 a gent actions, not each agent action

training:
  num_episodes: 30000
  total_frames: 50000000

evaluate:
  num_episodes: 100
  checkpoint_path: checkpoints/space_invaders/tests.pth